name: Update PyTorch Commits

on:
  workflow_dispatch:   # run manually from the Actions tab
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 6am UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate pytorch-commits.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_pytorch_commits.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pytorch-commits.html
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: update PyTorch commits [bot]" &&
            git push
          )
