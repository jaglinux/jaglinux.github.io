name: Update TorchAO Commits

on:
  workflow_dispatch:   # manual only — run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate torchao-commits.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_torchao_commits.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/torchao-commits.html
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: update TorchAO commits [bot]" &&
            git push
          )
